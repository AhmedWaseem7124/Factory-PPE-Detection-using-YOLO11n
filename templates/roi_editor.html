<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Factory ROI Editor</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .toolbar {
            padding: 12px;
            background: #222;
        }

        button, select {
            padding: 8px 14px;
            margin: 4px;
            cursor: pointer;
        }

        canvas {
            margin-top: 10px;
            border: 2px solid #555;
            max-width: 95vw;
            height: auto;
            cursor: crosshair;
        }

        #status {
            margin: 10px;
        }
    </style>
</head>

<body>

<div class="toolbar">
    <select id="zoneSelect">
        <option value="red">Red — Walking Paths</option>
        <option value="green">Green — Welding Zone</option>
        <option value="blue">Blue — Medium Zone</option>
        <option value="yellow">Yellow — Far Zone</option>
    </select>

    <button onclick="undoPoint()">Undo Point</button>
    <button onclick="clearCurrentZone()">Clear Zone</button>
    <button onclick="saveZones()">Save All Zones</button>
</div>

<div id="status">Click polygon points around the selected zone.</div>

<canvas id="roiCanvas" width="1280" height="720"></canvas>

<script>
    const canvas = document.getElementById("roiCanvas");
    const ctx = canvas.getContext("2d");
    const zoneSelect = document.getElementById("zoneSelect");
    const statusText = document.getElementById("status");

    const image = new Image();

    const zones = {
        red: [],
        green: [],
        blue: [],
        yellow: []
    };

    const colours = {
        red: "#ff0000",
        green: "#00ff00",
        blue: "#0080ff",
        yellow: "#ffff00"
    };

    image.onload = function () {
        drawEverything();
    };

    image.src = "/roi-frame?" + Date.now();

    function drawEverything() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

        for (const [zoneName, points] of Object.entries(zones)) {
            drawPolygon(zoneName, points);
        }
    }

    function drawPolygon(zoneName, points) {
        if (points.length === 0) return;

        ctx.strokeStyle = colours[zoneName];
        ctx.fillStyle = colours[zoneName];
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(
            points[0].x * canvas.width,
            points[0].y * canvas.height
        );

        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(
                points[i].x * canvas.width,
                points[i].y * canvas.height
            );
        }

        if (points.length >= 3) {
            ctx.closePath();
        }

        ctx.stroke();

        points.forEach(point => {
            ctx.beginPath();
            ctx.arc(
                point.x * canvas.width,
                point.y * canvas.height,
                5,
                0,
                Math.PI * 2
            );
            ctx.fill();
        });
    }

    canvas.addEventListener("click", function (event) {
        const rect = canvas.getBoundingClientRect();

        const displayedX = event.clientX - rect.left;
        const displayedY = event.clientY - rect.top;

        const normalizedX = displayedX / rect.width;
        const normalizedY = displayedY / rect.height;

        const selectedZone = zoneSelect.value;

        zones[selectedZone].push({
            x: normalizedX,
            y: normalizedY
        });

        statusText.textContent =
            `${selectedZone.toUpperCase()} points: ${zones[selectedZone].length}`;

        drawEverything();
    });

    function undoPoint() {
        const zone = zoneSelect.value;

        if (zones[zone].length > 0) {
            zones[zone].pop();
            drawEverything();
        }
    }

    function clearCurrentZone() {
        const zone = zoneSelect.value;
        zones[zone] = [];
        drawEverything();
    }

    async function saveZones() {
        for (const [zone, points] of Object.entries(zones)) {
            if (points.length < 3) {
                alert(`${zone} zone requires at least 3 points.`);
                return;
            }
        }

        const response = await fetch("/save-rois", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(zones)
        });

        const result = await response.json();

        if (result.success) {
            statusText.textContent = "ROIs saved successfully.";
            alert("ROIs saved to roi_polygons.json");
        } else {
            alert(result.error || "Unable to save ROIs.");
        }
    }
</script>

</body>
</html>
